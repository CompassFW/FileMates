# Lint contract — deliberately explicit.
#
# Without this file ruff lints against "whatever the installed version happens to
# default to". CI installs ruff unpinned, so on 2026-08-10 a newer ruff turned an
# untouched, previously-green tree red (85 findings: UP045, ISC004, … — rules that
# were not part of the default set when this code was written). A lint gate that
# changes meaning on its own is not a gate; it is noise that trains you to ignore red.
#
# So: the rule set is pinned HERE (and the ruff version is pinned in ci.yml). Adopting
# new rules stays possible — it just has to be a deliberate commit that also fixes the
# findings, never a silent side effect of a dependency resolving to a newer release.

target-version = "py311"          # oldest Python in the CI matrix

[lint]
select = ["E4", "E7", "E9", "F"]  # ruff's stable default set, written down explicitly
